[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "octorules-google"
version = "0.13.0"
description = "Google Cloud Armor provider for octorules"
license = "Apache-2.0"
requires-python = ">=3.10"
readme = "README.md"
authors = [
    { name = "Martin Simon" },
    { name = "Doctena S.A." },
]
keywords = ["google", "cloud-armor", "waf", "rules", "iac", "octorules"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "octorules>=0.33.0",
    "google-cloud-compute>=1.10,<2.0",
    "cel-python>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pre-commit>=3.5",
    "build",
]

[project.urls]
Homepage = "https://github.com/doctena-org/octorules-google"
Repository = "https://github.com/doctena-org/octorules-google"
Issues = "https://github.com/doctena-org/octorules-google/issues"

[project.entry-points."octorules.providers"]
google = "octorules_google:CloudArmorProvider"

[tool.setuptools.packages.find]
include = ["octorules_google*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use intentional unicode chars and regex metacharacters in match= patterns.
"tests/*" = ["RUF002", "RUF043"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # google.api_core warns at import time on Python 3.10 (supported here per
    # the version policy until its 2026-10 EOL); an upstream advisory about
    # the interpreter is not a defect in this package.
    "ignore:You are using a Python version:FutureWarning",
]
